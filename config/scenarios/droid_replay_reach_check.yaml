# Scenario: DROID replay — reach check (the Project-2 bridge).
# Replays a curated DROID episode on the MuJoCo Franka Panda and verifies the
# replayed motion stays inside the reachable envelope. Focus criterion: reach.
#
# Threshold precedence: values omitted below inherit config/safety.yaml defaults.

id: droid_replay_reach_check
robot: franka_panda                 # MuJoCo Menagerie — exact model dir/MJCF VERIFIED at M2
scene: cells/single_arm_cell.xml    # authored at M2 (arm + human_zone_1 proxy)

trajectory:
  type: droid_replay                # scripted | ik_waypoints | droid_replay
  source: lerobot/droid_100         # curated episode source (Project 2)
  episode_index: 3
  # DECISION/verify at M5: DROID action space (cartesian+gripper vs joint)
  # -> MuJoCo actuator mapping. Do NOT assume; check the dataset card.

criteria:
  reach:                            # <- focus of this scenario
    workspace_margin_m: 0.02        # inherits safety.yaml default (stated for clarity)
  cycle_time: {}                    # inherits safety.yaml default (15.0 s)
  clearance:
    obstacle_zones: [human_zone_1]
    min_distance_m: 0.30            # inherits safety.yaml default (stated for clarity)

render:
  mujoco: true                      # headless overlay MP4 (default path, M4)
  blender_hero: false               # hero-clip selection is a separate DECISION at M6
  cameras: [front, side]
