# Global safety thresholds (M1).
#
# NOTE: these values are ILLUSTRATIVE for a portfolio demo. ISO 10218 and
# ISO/TS 15066 are the real collaborative-robot standards; do NOT present these
# numbers as certified compliance.
#
# Precedence: a scenario's criteria may OVERRIDE any of these; anything a
# scenario omits falls back to the defaults here. `obstacle_zones` is always
# scenario-specific (defined per scenario, not here).

defaults:
  cycle_time_max_s: 15.0          # a run must finish within this wall-clock budget
  min_human_clearance_m: 0.30     # min arm-to-human-zone distance allowed
  reach_workspace_margin_m: 0.02  # TCP must stay inside the reachable envelope by this margin

verdict:
  on_any_fail: FAIL               # a scenario passes only if ALL its criteria pass
