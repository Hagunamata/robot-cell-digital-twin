# Docker Compose — MuJoCo (headless) side only.
#
# The MuJoCo simulation and native render run HEADLESS here (OSMesa software GL)
# and need no GPU. Blender hero rendering is NOT part of this compose file — it
# is a separate step run natively on the Windows host (see render/blender/).

services:
  twin:
    build: .
    image: robot-cell-digital-twin:dev
    working_dir: /workspace
    environment:
      - MUJOCO_GL=${MUJOCO_GL:-osmesa}   # osmesa = CPU software GL; egl if a GPU is present
      - PYOPENGL_PLATFORM=${PYOPENGL_PLATFORM:-osmesa}
    volumes:
      - ./:/workspace                    # live code; outputs/ written back to host (gitignored)
    command: ["make", "help"]
